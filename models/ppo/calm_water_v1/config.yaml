# PPO (clipped surrogate) with a continuous rudder command.
#
# These are the settings that produced models/ppo/calm_water_v1.
# Train with:  python scripts/train.py configs/ppo.yaml
#
# PPO is on-policy: it collects `episodes_per_iteration` fresh episodes, runs
# `epochs` passes over them, then discards the batch. Total episodes are
# therefore iterations * episodes_per_iteration = 5000 here.

algorithm: ppo
experiment: ppo
run_name: calm_water_v1
seed: 43738
description: >
  Proximal Policy Optimization with a clipped surrogate objective and a
  continuous rudder. On-policy learning makes it markedly more sample-hungry
  per gradient step than DDPG, but it trains more stably.

environment:
  episode_steps: 160
  integration_dt: 0.3
  arrival_radius: 0.5
  terminal_reward: 100.0
  initial_surge: 1.0
  goal_radius_range: [8, 28]

  action_space:
    type: continuous
    max_rudder_deg: 35.0

  reward:
    cross_track_scale: 2.0
    cross_track_decay: 0.08
    cross_track_offset: -1.0
    course_scale: 1.3
    course_decay: 10.0
    course_offset: -0.3
    distance_weight: 0.25

  conditions:
    wind:
      enabled: false
      speed: 0.0
      direction_deg: 0.0
    wave:
      enabled: false
      height: 0.0
      period: 0.0
      direction_deg: 0.0

agent:
  actor:
    layers: [128, 128]
    activation: tanh
  value:
    layers: [128, 128]
    activation: tanh
  learning_rate:
    initial: 0.001
    decay_steps: 3000
    decay_rate: 0.5
  discount: 0.96
  clip_ratio: 0.2 # importance ratio clipping
  gae_lambda: 0.95 # generalised advantage estimation
  entropy_regularization: 0.01
  epochs: 10 # optimisation passes per collected batch
  greedy_eval: false
  normalize_rewards: true
  normalize_observations: true

training:
  iterations: 100
  episodes_per_iteration: 50
  checkpoint_every: 5
  checkpoint_after: 50 # skip checkpoints before this iteration
  metric_window: 1
